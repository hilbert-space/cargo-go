name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build and package binary
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          TARGET=$(rustc +stable -vV | sed -n 's/^host: //p')
          BINARY="cargo-go"
          if [[ "$TARGET" == *windows* ]]; then
            BINARY="${BINARY}.exe"
          fi

          cargo +stable build --release --target "$TARGET"

          PACKAGE_DIR="cargo-go-${TARGET}-v${VERSION}"
          mkdir -p "dist" "stage/${PACKAGE_DIR}"
          cp "target/${TARGET}/release/${BINARY}" "stage/${PACKAGE_DIR}/"
          tar -czf "dist/cargo-go-${TARGET}-v${VERSION}.tgz" -C stage "$PACKAGE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    name: Publish crate to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          gh release create "v${VERSION}" dist/* \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes
